<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LapTime-Vision v3.1 | Pro Fix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+TC:wght@400;700&display=swap');
:root{
  --bg:#0a0e1a;--panel:#121929;--border:#1e2d4a;
  --accent:#00d4ff;--accent2:#ff6b35;
  --green:#00e676;--red:#ff1744;--yellow:#ffea00;
  --text:#e8f4fc;--muted:#7a9ab5;--card:#162035;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── SETUP ── */
#setup-section{padding:16px;flex-grow:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
h2{font-size:18px;margin-bottom:12px;color:var(--accent);display:flex;align-items:center;gap:8px}
input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:16px}
button{background:linear-gradient(135deg, var(--accent), #0088ff);border:none;font-weight:bold;cursor:pointer;transition:0.2s}
button:active{transform:scale(0.98)}
button.secondary{background:var(--border)}

/* ── TRACKER (Main UI) ── */
#tracker-section{display:none;position:relative;flex-grow:1;background:#000;overflow:hidden}
#video-container{position:relative;width:100%;height:100%}
video{width:100%;height:100%;object-fit:cover}
canvas#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* UI Overlays */
.ui-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.status-pill{background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px;border:1px solid var(--accent);
  font-family:'Rajdhani';font-size:14px;backdrop-filter:blur(4px)}
.ui-bottom{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:15px;padding:0 20px}
.action-btn{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:bold;border:2px solid #fff;box-shadow:0 0 15px rgba(0,0,0,0.5)}
#reg-btn{background:var(--accent2)}
#start-btn{background:var(--green)}
#stop-btn{background:var(--red);display:none}

/* Log Panel */
#log-panel{position:absolute;top:60px;right:10px;width:180px;max-height:60%;overflow-y:auto;
  background:rgba(18,25,41,0.8);border-radius:8px;padding:8px;font-size:12px;border:1px solid var(--border)}
.log-item{padding:4px;border-bottom:1px solid var(--border);animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

/* Bib Preview */
#bib-preview-box{position:absolute;bottom:100px;left:10px;width:120px;height:80px;border:2px solid var(--accent);
  background:#000;display:none}
#bib-preview-box canvas{width:100%;height:100%;object-fit:contain}

/* Loading Overlay */
#loader{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999}
</style>
</head>
<body>

<div id="loader">辨識中... 請保持鏡頭穩定</div>

<div id="setup-section">
  <div class="setup-card">
    <h2>🔑 Claude API 設定</h2>
    <input type="password" id="api-key-input" placeholder="貼上您的 Claude API Key" value="">
    <p style="font-size:12px; color:var(--muted)">修正：已加入 CORS 請求優化與 Header 補全。</p>
  </div>
  
  <div class="setup-card">
    <h2>📋 學生名單 (Excel/CSV)</h2>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
    <div id="file-info" style="font-size:13px; margin-top:8px">尚未載入名單</div>
  </div>

  <div class="setup-card">
    <h2>⚙️ 環境設定</h2>
    <label style="font-size:13px">偵測敏感度 (建議 50):</label>
    <input type="range" id="sens-range" min="20" max="100" value="50">
    <button id="enter-app-btn">進入系統</button>
  </div>
</div>

<div id="tracker-section">
  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div class="ui-top">
      <div class="status-pill" id="conn-status">SYSTEM READY</div>
      <div class="status-pill" id="stats-pill" style="border-color:var(--yellow)">00:00:00</div>
    </div>

    <div id="log-panel"></div>
    
    <div id="bib-preview-box">
      <canvas id="bib-canvas"></canvas>
      <div style="font-size:10px;text-align:center;background:rgba(0,0,0,0.5)">PREVIEW</div>
    </div>

    <div class="ui-bottom">
      <button class="action-btn" id="reg-btn">啟動相機<br>登錄號碼</button>
      <button class="action-btn" id="start-btn">開始<br>偵測衝線</button>
      <button class="action-btn" id="stop-btn">停止</button>
      <button class="action-btn" style="background:#444" onclick="location.reload()">退出</button>
    </div>
  </div>
</div>

<script>
/**
 * LapTime-Vision v3.1 專業修正版
 * 重點更新：Claude API Header 補全、ROI 縮小、連拍優化、對比度拉伸
 */

let state = {
  stream: null,
  students: {}, // {bib: name}
  isDetecting: false,
  isRegistering: false,
  lastFrameData: null,
  finishLineY: 0.7, // 終點線位置
  diffThresh: 50,
  logs: []
};

const el = {
  video: document.getElementById('video'),
  overlay: document.getElementById('overlay'),
  bibCanvas: document.getElementById('bib-canvas'),
  logPanel: document.getElementById('log-panel'),
  loader: document.getElementById('loader'),
  stats: document.getElementById('stats-pill')
};

// 1. 檔案載入
document.getElementById('file-input').onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = (ev) => {
    const data = new Uint8Array(ev.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);
    
    state.students = {};
    json.forEach(row => {
      const bib = String(row['號碼'] || row['bib'] || '').trim();
      const name = String(row['姓名'] || row['name'] || '').trim();
      if(bib) state.students[bib] = name;
    });
    document.getElementById('file-info').innerText = `已載入 ${Object.keys(state.students).length} 位學生`;
  };
  reader.readAsArrayBuffer(file);
};

// 2. 進入系統
document.getElementById('enter-app-btn').onclick = async () => {
  const key = document.getElementById('api-key-input').value;
  if(!key) return alert("請輸入 Claude API Key 才能執行辨識");
  
  state.diffThresh = parseInt(document.getElementById('sens-range').value);
  document.getElementById('setup-section').style.display = 'none';
  document.getElementById('tracker-section').style.display = 'block';
  
  await initCamera();
};

async function initCamera() {
  try {
    // 修正：加入更嚴格的影像請求，提升 FPS 與穩定度
    const constraints = {
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 60 }
      }
    };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    el.video.srcObject = state.stream;
    
    // 嘗試設定連續對焦與曝光 (部分 Android 支援)
    const track = state.stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities ? track.getCapabilities() : {};
    const settings = {};
    if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) settings.focusMode = 'continuous';
    if (capabilities.exposureMode && capabilities.exposureMode.includes('continuous')) settings.exposureMode = 'continuous';
    if (Object.keys(settings).length > 0) await track.applyConstraints({ advanced: [settings] });

    requestAnimationFrame(tick);
  } catch (e) {
    alert("相機啟動失敗: " + e);
  }
}

// 3. 核心迴圈
function tick() {
  if(!el.video.videoWidth) return requestAnimationFrame(tick);
  
  if(el.overlay.width !== el.video.videoWidth) {
    el.overlay.width = el.video.videoWidth;
    el.overlay.height = el.video.videoHeight;
  }
  
  const ctx = el.overlay.getContext('2d');
  ctx.clearRect(0, 0, el.overlay.width, el.overlay.height);
  
  const vw = el.overlay.width;
  const vh = el.overlay.height;

  // 繪製終點線
  ctx.strokeStyle = state.isDetecting ? 'red' : 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, vh * state.finishLineY);
  ctx.lineTo(vw, vh * state.finishLineY);
  ctx.stroke();

  // 註冊模式：繪製引導框 (修正：縮小 ROI 框，導引使用者對準胸口)
  if(state.isRegistering) {
    const roi = getROIRect(vw, vh);
    ctx.strokeStyle = '#ff6b35';
    ctx.lineWidth = 3;
    ctx.strokeRect(roi.x, roi.y, roi.w, roi.h);
    ctx.fillStyle = '#ff6b35';
    ctx.font = "20px Arial";
    ctx.fillText("請將號碼布對準此框", roi.x, roi.y - 10);
  }

  // 衝線模式：動態偵測
  if(state.isDetecting) {
    detectMotion(ctx, vw, vh);
  }

  requestAnimationFrame(tick);
}

// 4. 註冊功能 (OCR 號碼錄入)
document.getElementById('reg-btn').onclick = async () => {
  if(state.isRegistering) return;
  state.isRegistering = true;
  el.loader.style.display = 'flex';
  
  // 修正：等待畫面對焦穩定
  await new Promise(r => setTimeout(r, 600));

  const vw = el.video.videoWidth;
  const vh = el.video.videoHeight;
  const roi = getROIRect(vw, vh);
  
  const bibCtx = el.bibCanvas.getContext('2d');
  el.bibCanvas.width = roi.w;
  el.bibCanvas.height = roi.h;
  bibCtx.drawImage(el.video, roi.x, roi.y, roi.w, roi.h, 0, 0, roi.w, roi.h);
  
  // 修正：加入強化預處理
  preprocessBibCanvas(bibCtx, roi.w, roi.h);
  
  const b64 = el.bibCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
  document.getElementById('bib-preview-box').style.display = 'block';

  const num = await claudeOCR(b64);
  
  if(num && num !== 'null') {
    const name = state.students[num] || "未知選手";
    addLog(`✅ 登錄成功: ${num} (${name})`);
    showStatus(`已登錄: ${num}`, "var(--green)");
  } else {
    addLog("❌ OCR 無法辨識，請重試");
    showStatus("辨識失敗", "var(--red)");
  }
  
  el.loader.style.display = 'none';
  state.isRegistering = false;
};

// 5. 衝線功能
document.getElementById('start-btn').onclick = () => {
  state.isDetecting = true;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('stop-btn').style.display = 'block';
  addLog("🚀 開始監測終點線...");
};

document.getElementById('stop-btn').onclick = () => {
  state.isDetecting = false;
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('stop-btn').style.display = 'none';
};

// 偵測邏輯
async function detectMotion(ctx, vw, vh) {
  const lineY = Math.floor(vh * state.finishLineY);
  const scanH = 40; 
  
  const offCanvas = document.createElement('canvas');
  offCanvas.width = vw;
  offCanvas.height = scanH;
  const octx = offCanvas.getContext('2d');
  octx.drawImage(el.video, 0, lineY, vw, scanH, 0, 0, vw, scanH);
  const currData = octx.getImageData(0, 0, vw, scanH).data;
  
  if(state.lastFrameData) {
    let diffs = [];
    for(let x=0; x<vw; x+=10) {
      let idx = (x + (scanH/2)*vw)*4;
      let diff = Math.abs(currData[idx] - state.lastFrameData[idx]);
      if(diff > state.diffThresh) diffs.push(x);
    }
    
    if(diffs.length > 5) {
      const minX = Math.min(...diffs);
      const maxX = Math.max(...diffs);
      const centerX = (minX + maxX) / 2;
      
      // 繪製偵測點
      ctx.fillStyle = varColor('--accent');
      ctx.fillRect(minX, lineY, maxX-minX, scanH);
      
      // 觸發捕捉
      state.isDetecting = false; // 暫停偵測以處理 OCR
      handleFinish(centerX, lineY, vw, vh);
    }
  }
  state.lastFrameData = currData;
}

async function handleFinish(x, y, vw, vh) {
  addLog("🏁 偵測到衝線！捕捉號碼中...");
  
  // 修正：改為 8 張連拍，間隔 15ms，確保在高速下抓到不糊的幀
  const frames = [];
  const captureW = Math.floor(vw * 0.3);
  const captureH = Math.floor(vh * 0.4);
  
  for(let i=0; i<8; i++) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = captureW;
    tempCanvas.height = captureH;
    const tctx = tempCanvas.getContext('2d');
    
    // 修正：抓取人體框位置時加入更高的 Padding (y-0.2) 確保抓到胸口
    const grabX = Math.max(0, x - captureW/2);
    const grabY = Math.max(0, y - captureH * 0.7); 
    
    tctx.drawImage(el.video, grabX, grabY, captureW, captureH, 0, 0, captureW, captureH);
    preprocessBibCanvas(tctx, captureW, captureH);
    frames.push(tempCanvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
    await new Promise(r => setTimeout(r, 15));
  }

  // 呼叫 API (取第一張嘗試，進階版可傳多圖或選最清晰的一張)
  const num = await claudeOCR(frames[2]); 
  
  if(num && num !== 'null') {
    const name = state.students[num] || "未知";
    const time = new Date().toLocaleTimeString();
    addLog(`🏆 ${num} ${name} - ${time}`);
    // 語音播報
    const msg = new SpeechSynthesisUtterance(`${num}號 ${name} 衝線`);
    window.speechSynthesis.speak(msg);
  } else {
    addLog("⚠️ 辨識失敗 (無號碼)");
  }
  
  await new Promise(r => setTimeout(r, 1500)); // 冷卻時間
  state.isDetecting = true;
}

// 6. OCR 與 預處理
async function claudeOCR(base64Image) {
  const apiKey = document.getElementById('api-key-input').value;
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'dangerously-allow-browser': 'true' // 修正：允許瀏覽器直接請求
      },
      body: JSON.stringify({
        model: "claude-3-5-sonnet-20240620",
        max_tokens: 20,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Image } },
            { type: "text", text: "What is the student bib number in this image? Return ONLY the number digits. If none, return 'null'." }
          ]
        }]
      })
    });
    
    if(!response.ok) throw new Error(`API Error ${response.status}`);
    const res = await response.json();
    return res.content[0].text.trim();
  } catch (e) {
    console.error("Claude API 失敗:", e);
    return null;
  }
}

function preprocessBibCanvas(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  
  // 修正：對比度拉伸預處理，協助 OCR 辨識淺色或過曝號碼
  for (let i = 0; i < d.length; i += 4) {
    const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
    // 拉伸：(v - min) * (255 / (max - min))
    let v = (gray - 40) * (255 / 180); 
    v = v < 0 ? 0 : (v > 255 ? 255 : v);
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  
  // 放大 (已透過 Canvas 寬高縮放處理)
}

function getROIRect(w, h) {
  // 修正：改為橫向矩形，精準對準胸口號碼布，寬 40% 高 20%
  const rw = Math.floor(w * 0.4);
  const rh = Math.floor(h * 0.22);
  const rx = (w - rw) / 2;
  const ry = h * 0.35; // 位於畫面中心偏上
  return { x: rx, y: ry, w: rw, h: rh };
}

// 輔助函式
function addLog(msg) {
  const item = document.createElement('div');
  item.className = 'log-item';
  item.innerText = msg;
  el.logPanel.prepend(item);
  if(el.logPanel.childNodes.length > 50) el.logPanel.lastChild.remove();
}

function showStatus(txt, color) {
  const p = document.getElementById('conn-status');
  p.innerText = txt;
  p.style.borderColor = color;
}

function varColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

setInterval(() => {
  el.stats.innerText = new Date().toLocaleTimeString('en-GB');
}, 1000);
</script>
</body>
</html>
